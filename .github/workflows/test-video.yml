name: Test English Voice Vietnamese Subtitles Video
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-voice.txt
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y espeak-ng libsndfile1 ffmpeg fonts-dejavu-core
      - name: Install Kokoro
        run: python -m pip install -r requirements-voice.txt
      - name: Generate narration
        run: python scripts/kokoro_voice.py samples/demo_en.txt output/demo_voice.wav
      - name: Render vertical preview
        run: python scripts/render_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: video-demo-en-voice-vi-sub
          path: |
            output/demo_news.mp4
            output/demo_voice.wav
            output/demo_vi_timed.srt
          if-no-files-found: error
